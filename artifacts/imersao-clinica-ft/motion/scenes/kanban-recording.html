<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clínica FT: avanço autônomo registrado</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="../runtime/fonts.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b101a}
#main{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter, sans-serif;color:#f5f7fc}
#capture-viewport{position:absolute;left:0;top:0;width:1920px;height:810px;overflow:hidden}
#camera{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0}
video{display:block;width:1440px;height:900px}
#provenance{position:absolute;left:410px;top:855px;width:1100px;font-size:40px;line-height:1.3;font-weight:450;text-align:center;text-shadow:0 2px 7px #000,0 0 20px #000}
</style>
</head>
<body>
<div id="main">
  <div id="capture-viewport"><div id="camera"><video src="../source/kanban-captura.mp4" muted playsinline preload="auto" data-start="0"></video></div></div>
  <div id="provenance">Captura real · homologação<br>Gravação anterior · avanço real da IA</div>
</div>
<script src="../runtime/vendor/gsap.min.js"></script>
<script src="../runtime/motion.js"></script>
<script>
const M=Motion.film({fps:30,duration:9,width:1920,height:1080,clock:'smooth'});
// A câmera segue os pixels da gravação; o card nunca é animado separadamente.
function pose(frame,cx,cy,scale,ease='cruise'){return [frame,{x:960-cx*scale,y:450-cy*scale,scale},ease]}
M.camera('#camera',[
  pose(0,960,495,3.05),pose(12,965,495,3.16,'softLand'),
  pose(105,976,497,3.22),pose(122,1040,493,3.2,'softLand'),
  pose(158,1125,493,3.24),
  pose(170,1128,494,3.28,'accelExit'),
  pose(171,720,449,3.25),pose(184,720,450,3.32,'softLand'),
  pose(215,720,449,3.39),pose(216,713,470,3.46),
  pose(270,716,470,3.54)
],{origin:'0% 0%'});
M.mark(171,'cut','A câmera chega ao painel de auditoria real');
M.mark(216,'cut','Detalhe do movimento e da confiança registrados');
M.kf('#provenance','y',[[0,0],[171,-8],[270,0]]);
window.__ready=Motion.loaded().then(()=>{window.__seekcheck=Motion.selfTest(M,{samples:24});window.__seek(0);});
</script>
</body>
</html>
